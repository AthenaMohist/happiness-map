<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>住得爽指数 v2 — HAP-001 样板间（真实 JSON 数据）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
  body { background:#14161f; color:#f4f4f4; display:flex; flex-direction:column; align-items:center; padding:10px; }
  h1 { font-size:19px; color:#ffcd75; }
  .sub { font-size:11px; color:#8a97ad; margin:2px 0 8px; }
  #controls { display:flex; gap:6px; margin:6px 0; flex-wrap:wrap; justify-content:center; }
  .grp { display:flex; gap:4px; background:#1f2436; border-radius:8px; padding:4px 6px; align-items:center; }
  .grp label { font-size:11px; color:#8a97ad; }
  button { background:#29366f; color:#f4f4f4; border:2px solid #3b5dc9; border-radius:5px; padding:4px 10px; cursor:pointer; font-size:12px; }
  button.active { background:#f4a259; color:#14161f; border-color:#ffcd75; font-weight:bold; }
  canvas { image-rendering:pixelated; border:3px solid #333c57; border-radius:8px; display:block; }
  #panel { width:560px; font-size:12px; background:#1f2436; border-radius:8px; padding:10px; margin-top:8px; min-height:90px; }
  #panel h3 { color:#ffcd75; font-size:14px; margin-bottom:4px; }
  .bar { height:12px; background:#333c57; border-radius:6px; overflow:hidden; margin:4px 0 8px; }
  .bar>div { height:100%; border-radius:6px; }
  .c { display:inline-block; margin-right:10px; }
  #estate-list { display:none; }
  #errbox { display:none;background:#5a1a1a;color:#ffb3b3;padding:8px;font-size:12px;white-space:pre-wrap;max-width:900px }
</style>
</head>
<body>
<h1>🏘️ 住得爽指数 <span style="font-size:11px;color:#8a97ad">v2 · HAP-001 样板间 · 9 小区真实评分 JSON 驱动</span></h1>
<div class="sub">数据: data/pilot/scores/estates.json（9 小区 · glm-5 · prompt v1）· 80%小区≤60分 · 60=过得不错</div>
<div id="controls">
  <div class="grp"><label>人群</label>
    <button data-g="single" class="active">单身</button><button data-g="couple">小两口</button>
    <button data-g="family">三代同堂</button><button data-g="elder">空巢老人</button>
  </div>
  <div class="grp"><label>年收入</label>
    <button data-i="0" class="active">10万</button><button data-i="1">30万</button>
    <button data-i="2">100万</button><button data-i="3">500万</button>
  </div>
  <div class="grp"><button id="heat">🔥 热力图</button><button id="rng">◎ 影响范围</button></div>
</div>
<canvas id="cv" width="920" height="600"></canvas>
<div id="panel">⏳ 正在加载 data/pilot/scores/estates.json …</div>
<div id="estate-list"></div>
<div id="errbox"></div>
<script>
window.onerror = function(msg, src, line, col) {
  var b = document.getElementById('errbox');
  if (b) { b.style.display='block'; b.textContent += 'JS错误: '+msg+' @line '+line+'\n'; }
  return false;
};
function fail(msg){ var b=document.getElementById('errbox'); b.style.display='block'; b.textContent+=msg+'\n';
  document.getElementById('panel').textContent='❌ 数据加载失败: '+msg; }
</script>
<script>
// ============ v2 渲染引擎（基底: demo_v7.html） ============
const HEX=22;
const INCOME=['10万','30万','100万','500万'];
// 收入匹配系数: [普服区×4档, 富服区×4档]
const INC_FIT = {
  normal:[1.0,1.2,1.0,0.8],
  rich:  [0.3,0.6,1.0,1.2],
};
const GROUPS=['single','couple','family','elder'];
const GROUPS_NAME={single:'单身租房',couple:'小两口',family:'三代同堂',elder:'空巢老人'};
// 设施: hex 坐标(axial q,r)。tier: need/rare/strat/wonder; rich=富人服务
const POIS=[
 {n:'南光菜市场', t:'need', kind:'market', q:44,r:24},
 {n:'地铁南油西', t:'need', kind:'metro',  q:40,r:28},
 {n:'南山医院',  t:'need', kind:'hosp',   q:30,r:26},
 {n:'永新汇喷泉花园', t:'rare', kind:'park', q:47,r:20, w:{single:3,couple:5,family:8,elder:4}},
 {n:'荔香公园',  t:'rare', kind:'park', q:33,r:22, w:{single:3,couple:5,family:7,elder:6}},
 {n:'早茶老字号', t:'rare', kind:'food', q:38,r:32, w:{single:3,couple:5,family:7,elder:9}},
 {n:'南油尾货工业区', t:'strat', kind:'bargain', q:37,r:36, w:{single:10,couple:12,family:16,elder:6}},
 {n:'海岸城商圈', t:'strat', kind:'mall', q:22,r:22, w:{single:8,couple:10,family:6,elder:4}},
 {n:'南山实验学校', t:'rare', kind:'edu', q:35,r:18, w:{single:0,couple:9,family:12,elder:0}},
 {n:'网红小吃城', t:'trap', kind:'trap', q:24,r:18, w:{single:-5,couple:-7,family:-9,elder:-3}},
 {n:'深圳湾海景栈道(旅游奇观·居民加成低)', t:'wonder', kind:'wonder_tour', q:14,r:34, w:{single:4,couple:5,family:5,elder:4}},
];
// 富人社区设施
const RICH_POIS=[
 {n:'湾区国际学校', t:'strat', kind:'edu', q:16,r:12, w:{single:0,couple:14,family:18,elder:0}, rich:true},
 {n:'私立综合医院(高端)', t:'strat', kind:'hosp', q:12,r:10, w:{single:2,couple:5,family:8,elder:16}, rich:true},
 {n:'游艇会/马术俱乐部', t:'rare', kind:'lux', q:18,r:8, w:{single:2,couple:4,family:3,elder:1}, rich:true},
];
// 9 小区 hex 坐标(手工排布, 互不重叠; 富区靠东侧近 RICH_POIS)
const HEXPOS={
 'shenzhenwan-yihao':      {q:21,r:10},
 'wanxi':                  {q:16,r:14},
 'bandao-chengbang':       {q:26,r:13},
 'huaruncheng-runfu':      {q:31,r:15},
 'weilan-haian':           {q:36,r:17},
 'hengyu-bincheng':        {q:41,r:19},
 'nanshan-yipin':          {q:44,r:24},
 'nanyou-shenghuoqu':      {q:38,r:33},
 'yangguangdai-haibincheng':{q:31,r:29},
};
let ESTATES=[]; // fetch 后填充
const RANGE={need:[1,2], rare:[2,4], strat:[4,7], wonder:[999]};
function hexDist(q1,r1,q2,r2){ const dq=q1-q2, dr=r1-r2; return Math.max(Math.abs(dq),Math.abs(dr),Math.abs(-dq-dr)); }
function hexToPix(q,r){ return [460+(q-29.5)*HEX*1.732, 300+(r-22)*HEX*1.5 + (q%2?HEX*0.75:0)]; }

// 分数: 真实 JSON dimensions.score 驱动, 收入匹配系数(规则v2 人群×收入矩阵)调制
function score(e,g,inc){
  const dim=e.dim[g];                       // JSON dimensions.{g}.score
  const fit=(e.rich?INC_FIT.rich:INC_FIT.normal)[inc];
  const s=Math.max(5,Math.min(97,Math.round(dim*fit)));
  // 周边设施(规则v2 衰减引擎, 仅作参考展示, 不改分)
  const contrib=[];
  for(const p of POIS.concat(RICH_POIS)){
    if(p.rich && !e.rich && inc<2) continue;
    const d=hexDist(e.q,e.r,p.q,p.r); const rr=RANGE[p.t]; if(!rr) continue;
    if(d>rr[rr.length-1]) { if(p.t==='need') contrib.push({n:`远:${p.n}`, v:0, tier:'need'}); continue; }
    const zone=d<=rr[0]?1:(d<=rr[1]?0.6:0.3);
    if(p.t==='need'){ contrib.push({n:p.n, v:Math.round(zone*10)/10, tier:p.t}); }
    else { const v=Math.round((p.w[g]||0)*zone*fit*10)/10; if(Math.abs(v)>=0.5) contrib.push({n:p.n,v,tier:p.t}); }
  }
  return {raw:dim, score:s, fit, contrib};
}
const TIER_C={need:'#41a6f6',rare:'#a7f070',strat:'#f4a259',wonder:'#e6b3ff',trap:'#e64539',base:'#8a97ad'};
const TIER_N={need:'必需',rare:'稀有',strat:'战略',wonder:'奇观',trap:'陷阱',base:'本体'};

// ============ 渲染 ============
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let G='single', I=0, HEAT=false, RNG=false, SEL=null;
function hexPath(x,y,s){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); const px=x+s*Math.cos(a), py=y+s*Math.sin(a); i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); }
function render(){
  ctx.fillStyle='#1a2340'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#155a70'; ctx.fillRect(0,480,cv.width,120);
  for(let q=11;q<49;q++)for(let r=6;r<39;r++){
    const [x,y]=hexToPix(q,r); if(x>920||x<0||y>560||y<0) continue;
    const t=(q*7+r*13)%5;
    ctx.fillStyle=['#26314f','#2a3352','#2d3856','#283350','#2b3654'][t];
    hexPath(x,y,HEX-1); ctx.fill();
    ctx.strokeStyle='#1a2340'; ctx.lineWidth=1; ctx.stroke();
  }
  if(RNG){ for(const p of POIS.concat(RICH_POIS)){
    const rr=RANGE[p.t]; if(rr[0]>100) continue;
    const [px,py]=hexToPix(p.q,p.r);
    ctx.fillStyle=(TIER_C[p.t]+'33'); hexPath(px,py,HEX*(rr[1]+0.9)); ctx.fill();
    ctx.fillStyle=(TIER_C[p.t]+'55'); hexPath(px,py,HEX*(rr[0]+0.9)); ctx.fill();
  }}
  if(HEAT){ for(const e of ESTATES){ const sc=score(e,G,I).score;
    const [x,y]=hexToPix(e.q,e.r);
    const col = sc>=75?'#38b764': sc>=60?'#a7f070': sc>=45?'#ffcd75': sc>=30?'#f4a259':'#e64539';
    ctx.fillStyle=col+'66'; hexPath(x,y,HEX*4); ctx.fill(); } }
  for(const p of POIS.concat(RICH_POIS)){ const [x,y]=hexToPix(p.q,p.r);
    ctx.fillStyle=TIER_C[p.t]; hexPath(x,y,HEX-6); ctx.fill();
    ctx.fillStyle='#14161f'; ctx.font='bold 8px sans-serif'; ctx.textAlign='center';
    const ch={market:'菜',metro:'铁',hosp:'医',park:'园',food:'食',bargain:'工',mall:'商',edu:'学',trap:'⚠',wonder_tour:'奇',lux:'奢'}[p.kind];
    ctx.fillText(ch,x,y+3);
    if(p.t==='wonder'){ ctx.strokeStyle='#e6b3ff'; ctx.lineWidth=2; hexPath(x,y,HEX-2); ctx.stroke(); }
  }
  for(const e of ESTATES){ const [x,y]=hexToPix(e.q,e.r);
    const s=score(e,G,I);
    ctx.fillStyle=SEL===e?'#ffcd75':'#f4f4f4'; hexPath(x,y,HEX-2); ctx.fill();
    ctx.fillStyle=SEL===e?'#14161f':(s.score>=60?'#2d6a4f':'#29366f'); hexPath(x,y,HEX-6); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif';
    ctx.fillText(s.score, x, y+3);
    ctx.fillStyle= e.rich?'#e6b3ff':'#f4f4f4'; ctx.font='11px sans-serif';
    ctx.fillText(e.n, x-26, y-HEX-4);
    if(e.rich){ ctx.font='8px sans-serif'; ctx.fillStyle='#e6b3ff88'; ctx.fillText('rich', x+18, y-HEX-4); }
  }
  // 可见性探针: 右下红块 + 左上黄块
  ctx.fillStyle='#ff2222'; ctx.fillRect(cv.width-60, cv.height-60, 60, 60);
  ctx.fillStyle='#ffdd00'; ctx.fillRect(0, 0, 60, 60);
}
function showPanel(e){
  const s=score(e,G,I); const pn=document.getElementById('panel');
  const col=s.score>=75?'#38b764':s.score>=60?'#a7f070':s.score>=45?'#ffcd75':'#e64539';
  const dim=e.dimDetail[G]||{};
  let h=`<h3>${e.n} <span style="color:${col};font-size:20px">${s.score}分</span> <small style="color:#8a97ad">${GROUPS_NAME[G]} · 年入${INCOME[I]} · 维度原始分 ${s.raw} × 收入匹配 ${s.fit} · base ${e.base[G]} · 置信度 ${(e.confidence*100)|0}% · ${e.rich?'富服区':'普服区'}</small></h3>`;
  h+=`<div class="bar"><div style="width:${s.score}%;background:${col}"></div></div>`;
  h+=`<div style="color:#a7f070">维度依据: ${(dim.rationale||'').slice(0,120)}</div>`;
  if(dim.source_refs&&dim.source_refs.length) h+=`<div style="color:#8a97ad;font-size:11px">来源: ${dim.source_refs.join(' · ')}</div>`;
  h+='<div style="margin-top:4px;color:#8a97ad">周边设施(规则v2衰减·参考): </div>'+s.contrib.filter(c=>c.v!==0||c.tier==='need').slice(0,8).map(c=>`<span class="c" style="color:${c.v>=0?'#a7f070':'#e64539'}">[${TIER_N[c.tier]}] ${c.n} ${c.v>0?'+':''}${c.v}</span>`).join(' ');
  h+=`<br><small style="color:#8a97ad">${e.note} · 60分=及格, 80分=全城传奇</small>`;
  pn.innerHTML=h;
}
// 交互
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('active'));b.classList.add('active');G=b.dataset.g;render();SEL&&showPanel(SEL);});
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-i]').forEach(x=>x.classList.remove('active'));b.classList.add('active');I=+b.dataset.i;render();SEL&&showPanel(SEL);});
document.getElementById('heat').onclick=function(){HEAT=!HEAT;this.classList.toggle('active',HEAT);render();};
document.getElementById('rng').onclick=function(){RNG=!RNG;this.classList.toggle('active',RNG);render();};
cv.onclick=ev=>{ const r=cv.getBoundingClientRect(); const mx=ev.clientX-r.left, my=ev.clientY-r.top;
  for(const e of ESTATES){ const [x,y]=hexToPix(e.q,e.r); if(Math.hypot(mx-x,my-y)<HEX+8){ SEL=e; showPanel(e); render(); return; } } };

// ============ 数据加载: fetch 真实 estates.json ============
function loadEstates(data){
  ESTATES = data.estates.map(x=>{
    const pos=HEXPOS[x.estate]||{q:29,r:22};
    return {
      id:x.estate, n:x.display_name, q:pos.q, r:pos.r,
      rich:!!x.rich, base:x.base||{single:0,couple:0,family:0,elder:0},
      dim:{single:x.dimensions.single.score, couple:x.dimensions.couple.score,
           family:x.dimensions.family.score, elder:x.dimensions.elder.score},
      dimDetail:x.dimensions,
      confidence:x.confidence||0,
      note:(x.rich?'富人区·服务贵':'普服区')+(x.confidence_note?(' · '+x.confidence_note.slice(0,30)):''),
    };
  });
  // DOM 名册(--dump-dom 核对用)
  document.getElementById('estate-list').textContent = ESTATES.map(e=>e.n).join('|');
  render();
  document.getElementById('panel').textContent='👆 点击六边形小区查看评分明细（已加载 '+ESTATES.length+' 小区）';
}
(async function(){
  const urls=['data/pilot/scores/estates.json','/data/pilot/scores/estates.json'];
  let lastErr=null;
  for(const u of urls){
    try{
      const resp=await fetch(u);
      if(!resp.ok) throw new Error('HTTP '+resp.status+' ('+u+')');
      const data=await resp.json();
      if(!data||!Array.isArray(data.estates)||data.estates.length!==9) throw new Error('estates 数量异常: '+(data&&data.estates?data.estates.length:'?'));
      loadEstates(data); return;
    }catch(err){ lastErr=err; }
  }
  fail('estates.json 加载失败: '+lastErr.message+'（请从仓库根目录起 http.server，或将 data/pilot/ 相对本文件放置）');
})();
</script>
</body>
</html>
